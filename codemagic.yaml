workflows:
  android-apk-debug:
    name: Ehliyet Sınav - Android APK (Debug)
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      node: 20.11.1
      java: 17
      vars:
        PACKAGE_NAME: "com.ehliyet.sinavsorulari"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: '*'
          include: true
    scripts:
      - name: Bağımlılıkları yükle
        script: |
          npm install

      - name: Native Android projesini oluştur (Expo Prebuild)
        script: |
          npx expo prebuild --platform android --no-install

      - name: Android bağımlılıklarını yükle
        script: |
          cd android && ./gradlew --version

      - name: Debug APK derle (imzasız, test amaçlı)
        script: |
          cd android
          ./gradlew assembleDebug

    artifacts:
      - android/app/build/outputs/**/*.apk

    publishing:
      email:
        recipients: []
        notify:
          success: true
          failure: true
