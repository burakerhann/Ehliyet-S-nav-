workflows:
  android-apk-debug:
    name: Ehliyet Sınav - Android APK (Debug)
    max_build_duration: 60
    environment:
      node: 20.19.4
      java: 17
      vars:
        PACKAGE_NAME: "com.ehliyet.sinavsorulari"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: '*'
          include: true
    scripts:
      - name: Bağımlılıkları yükle
        script: |
          npm install
          npx expo install expo@latest
          npx expo install --fix
      - name: Native Android projesini oluştur (Expo Prebuild)
        script: |
          npx expo prebuild --platform android --no-install

      - name: Android bağımlılıklarını yükle
        script: |
          cd android && ./gradlew --version

      - name: Release APK derle (JS paketlenmiş, test amaçlı)
        script: |
          cd android
          ./gradlew assembleRelease

    artifacts:
      - android/app/build/outputs/**/*.apk

